[package]
name = "milestone_escrow"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "=22.0.0"

[dev-dependencies]
soroban-sdk = { version = "=22.0.0", features = ["testutils"] }

[patch.crates-io]
ed25519-dalek = "=2.1.0"
rand_core = "=0.6.4"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
